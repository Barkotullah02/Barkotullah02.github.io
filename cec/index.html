<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSU CEC &mdash; Join Form Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Login screen -->
  <section id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <h1 class="login-title">NSU CEC</h1>
      <p class="login-subtitle">Join form &mdash; admin sign in</p>

      <label class="field-label" for="login-email">Email</label>
      <input id="login-email" class="input" type="email" required autocomplete="username" />

      <label class="field-label" for="login-password">Password</label>
      <input id="login-password" class="input" type="password" required autocomplete="current-password" />

      <p id="login-error" class="error-text" hidden></p>

      <button id="login-submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </section>

  <!-- App shell -->
  <div id="app-shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <span class="wordmark">NSU CEC <span class="wordmark-sub">Join Admin</span></span>
        <div class="topbar-right">
          <span id="admin-name" class="admin-name"></span>
          <button id="logout-btn" class="btn btn-secondary btn-sm">Sign out</button>
        </div>
      </div>
      <nav id="tab-nav" class="tab-nav"></nav>
    </header>

    <main id="tab-content" class="content"></main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
